<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Elegí tu contraseña — MenúYa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="plain">
  <main class="center-card">
    <h1>Elegí tu contraseña</h1>
    <p id="intro" class="muted">Vas a usarla para ingresar a tu panel.</p>
    <div id="error" class="form-error hidden" role="alert"></div>
    <div id="ok" class="hidden"></div>
    <form id="form" novalidate>
      <label for="pw">Contraseña nueva</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="10" required>
      <p class="hint">Mínimo 10 caracteres. Una frase larga es más segura que una palabra con símbolos.</p>
      <label for="pw2">Repetí la contraseña</label>
      <input id="pw2" type="password" autocomplete="new-password" required>
      <div class="actions"><button class="btn primary" id="go" type="submit">Guardar contraseña</button></div>
    </form>
  </main>
  <script src="/establecer-contrasena.js" type="module"></script>
</body>
</html>
